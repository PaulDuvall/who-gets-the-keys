# The only path to the sandbox (SPEC-001). checks → build → attest → receipt → deploy.
# No caches in attest or deploy. The deploy role trusts only this file, in environment sandbox.
# Pushes only (SPEC-001-R40). The checks job has no job-level condition, and every other job needs it: GitHub reports a
# job that a condition skips as a success, which satisfies a required check.
# After the fifteen ordered checks, the checks job runs the task and scope checks over the range from HEAD's merge base
# with main (SPEC-001-R68). fetch-depth 0 brings refs/remotes/origin/main; on main itself the range is empty.
name: pipeline

on:
  push:
    branches: [main, "candidate/**"]

permissions: {}
cache-mode: none

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pipeline-checks-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install check tools
        run: |
          scripts/ci/install-tools.sh "$RUNNER_TEMP/tools/bin"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # Started with node, not npm run: npm hands a committed .npmrc's node-options and script-shell to what it starts (SPEC-001-R215).
      - name: Run every check
        run: node scripts/checks.ts
      - name: Check the task that the range's Task trailer names (SPEC-001-R64, R65, R68)
        run: node scripts/checks.ts task
      - name: Check the range's Task commits against that task (SPEC-001-R66, R67, R68)
        run: node scripts/checks.ts scope

  build:
    name: build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pipeline-build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # npm ci --ignore-scripts starts no process. The tsc line is package.json's build script, run without npm (SPEC-001-R215).
      - name: Build the Lambda artifact
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/tsc --noEmit false --outDir dist
          mkdir -p dist/function
          cp dist/src/*.js dist/function/
          echo '{"type":"module"}' > dist/function/package.json
          (cd dist/function && TZ=UTC touch -t 198001010000 ./* && zip -X -q ../function.zip ./*)
      - name: Write the receipt predicate from the commit's trailers (SPEC-001-R45)
        run: node scripts/receipt.ts predicate "$GITHUB_SHA" > dist/receipt-predicate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: function
          path: |
            dist/function.zip
            dist/receipt-predicate.json
          if-no-files-found: error

  attest:
    name: attest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/candidate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pipeline-attest-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: function
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/function.zip
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/function.zip
          predicate-type: https://github.com/PaulDuvall/who-gets-the-keys/provenance/v2
          predicate-path: dist/receipt-predicate.json

  receipt:
    name: receipt
    needs: attest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/candidate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pipeline-receipt-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: function
          path: dist
      - name: Verify the receipt and show it to the reviewer (SPEC-001-R50, R55)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh --version && node scripts/checks.ts receipt dist/function.zip

  deploy:
    name: deploy to sandbox
    needs: [build, attest, receipt]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sandbox
    concurrency:
      group: pipeline-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Deploy only main's tip, before reading the artifact or any AWS call (SPEC-001-R190)
        run: node scripts/checks.ts deploy-tip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: function
          path: dist
      - name: Verify the artifact's attestation before any AWS call
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/checks.ts attestation dist/function.zip
      - name: Verify the receipt again, pinned to main, before any AWS call (SPEC-001-R56)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/checks.ts receipt dist/function.zip deploy
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Plan, check for irreversible changes, apply that plan
        working-directory: infra/sandbox
        run: |
          sha="$(openssl dgst -sha256 -binary ../../dist/function.zip | base64)"
          account="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=who-gets-the-keys-tfstate-${account}-us-east-1-an"
          terraform plan -input=false -out=plan.out -var "artifact_sha256=$sha"
          terraform show -json plan.out > plan.json
          (cd ../.. && node scripts/checks.ts irreversible infra/sandbox/plan.json)
          terraform apply -input=false plan.out
