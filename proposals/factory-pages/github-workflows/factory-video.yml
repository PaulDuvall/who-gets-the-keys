# Builds the software-factory slide assets in factory-video/ (decision 0008): the 18 s loop as a
# GIF and a 3-minute MP4, the narrated guided video with and without burned-in captions, its
# captions file, the poster, and the claims report: which on-screen claims the repository has built.
# The claims job checks the ledger alone, with no browser and no voice, on every push to main that
# can move a claim: a signed spec, a decision, a proposal, the backlog or the progress record. It
# uploads the report as factory-claims-<short SHA>-<UTC time>. The build job runs when the kit,
# this workflow or docs/progress.json changed, so the end card always counts main (SPEC-001-R235),
# or on demand. On main it also lays out a page that plays the guided video, and the deploy job
# publishes it to GitHub Pages, https://paulduvall.github.io/who-gets-the-keys/. No job reads a
# secret, uses AWS or a cache. The prune job keeps only the newest artifact of each kind. Nothing
# is committed and no release is made, so no job needs contents: write.
name: factory-video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory-video/**"
      - ".github/workflows/factory-video.yml"
      - "specs/**"
      - "docs/decisions/**"
      - "proposals/**"
      - ".tasks/backlog.jsonl"
      - "docs/progress.json"

permissions: {}
cache-mode: none

jobs:
  claims:
    name: check the claims ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: factory-claims-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      video: ${{ steps.paths.outputs.video }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # verify.mjs imports Playwright only for the browser checks, so this needs no npm install.
      - name: Check that every on-screen claim cites evidence that exists
        run: node factory-video/verify.mjs --only claims
      - name: Decide whether the video itself needs a rebuild
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          video=true
          if [ "$EVENT" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- factory-video .github/workflows/factory-video.yml docs/progress.json &&
              video=false
          fi
          echo "video=${video}" >> "$GITHUB_OUTPUT"
          echo "Rebuild the video: ${video}"
      - name: Name the artifact factory-claims-<short SHA>-<UTC time>
        id: stamp
        run: echo "name=factory-claims-${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - name: Upload the claims report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: factory-video/out/claims-report.md
          if-no-files-found: error
          retention-days: 30

  build:
    name: build and check the factory video
    needs: claims
    if: needs.claims.outputs.video == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: factory-video-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: factory-video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Normally about 20 s. A hung package mirror once held this step for a whole job, so each
      # attempt is capped, a failed attempt is retried once, and the step stops at 6 minutes.
      - name: Install ffmpeg, poppler and Liberation fonts
        timeout-minutes: 6
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          apt_install() {
            sudo timeout 60 apt-get "${apt_opts[@]}" update &&
              sudo timeout 90 apt-get "${apt_opts[@]}" install -y --no-install-recommends \
                ffmpeg poppler-utils fonts-liberation
          }
          if ! apt_install; then
            echo "::warning::apt failed or timed out; retrying once"
            sudo dpkg --configure -a || true
            apt_install
          fi
      # Playwright comes from the walkthrough's pinned package, so this kit adds no dependency.
      - name: Install Playwright from video/record, and Chromium
        timeout-minutes: 8
        working-directory: video/record
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo npx --no-install playwright install-deps chromium
          npx --no-install playwright install chromium
      # The voice: Kokoro from hash-pinned requirements, and its two model files, which narrate.py
      # checks against the SHA-256 pins in narration/models.json before use.
      - name: Install Kokoro and its model files
        timeout-minutes: 6
        run: |
          python3 -m venv "$RUNNER_TEMP/kokoro"
          "$RUNNER_TEMP/kokoro/bin/pip" install --quiet --require-hashes -r narration/requirements.txt
          mkdir -p "$RUNNER_TEMP/kokoro-models"
          base="$(jq -r .source narration/models.json)"
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/kokoro-models/$f" "$base/$f"
          done
          echo "NARRATE_PYTHON=$RUNNER_TEMP/kokoro/bin/python" >> "$GITHUB_ENV"
          echo "KOKORO_MODEL_DIR=$RUNNER_TEMP/kokoro-models" >> "$GITHUB_ENV"
      # build.sh ends with verify.mjs, so a failed check stops the job before anything is uploaded.
      - name: Build and check
        run: ./build.sh
      - name: Name the artifact factory-video-<short SHA>-<UTC build time>
        id: stamp
        run: echo "name=factory-video-${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - name: Upload the videos, GIF, captions and poster
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: |
            factory-video/out/factory-guided.mp4
            factory-video/out/factory-guided-clean.mp4
            factory-video/out/factory-guided.srt
            factory-video/out/factory-full-3min.mp4
            factory-video/out/factory-full-1920.gif
            factory-video/out/poster.png
            factory-video/out/poster.pdf
            factory-video/out/claims-report.md
          if-no-files-found: error
          retention-days: 30
      # The page for GitHub Pages (SPEC-001-R235): the guided video, its captions and poster, and an index.html
      # that plays it and names the commit. Only on main; GITHUB_SHA is 40 hex digits, so nothing needs escaping.
      - name: Lay out the page for GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp out/factory-guided.mp4 out/factory-guided.srt out/poster.png "$site/"
          short="${GITHUB_SHA::7}"
          built="$(date -u +%Y-%m-%dT%H:%MZ)"
          cat > "$site/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Who Gets the Keys? The software factory</title>
          <style>body{margin:0 auto;max-width:1100px;padding:16px;font-family:system-ui,sans-serif;line-height:1.5}video{width:100%;height:auto;background:#000}</style>
          </head>
          <body>
          <h1>Who Gets the Keys? The software factory</h1>
          <video controls preload="metadata" poster="poster.png" src="factory-guided.mp4"></video>
          <p>The guided video, narrated and captioned. It shows the whole factory, then ends on a card of what is built and what is left, counted at commit <a href="https://github.com/${REPO}/commit/${GITHUB_SHA}">${short}</a> of <code>main</code>, built ${built} in <a href="https://github.com/${REPO}/actions/runs/${RUN_ID}">run ${RUN_ID}</a>.</p>
          <p><a href="factory-guided.srt">Captions (SRT)</a> &middot; <a href="https://github.com/${REPO}#progress">Progress against the specs</a> &middot; <a href="https://github.com/${REPO}">Repository</a></p>
          </body>
          </html>
          EOF
          du -sh "$site"
      - name: Upload the page for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # Publishes the page the build job laid out. It checks out nothing and runs no repository code: its one step is
  # actions/deploy-pages, which needs exactly these two permissions. No AWS role trusts this workflow's OIDC token
  # (infra/sandbox/iam.tf requires an exact job_workflow_ref of another workflow).
  deploy:
    name: publish the guided video to GitHub Pages
    needs: build
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: factory-video-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  prune:
    name: keep only the newest factory video and claims report
    needs: [claims, build]
    if: always() && needs.claims.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: factory-video-prune
      cancel-in-progress: false
    permissions:
      actions: write # deletes earlier factory-video artifacts; nothing else in this job
    steps:
      - name: Delete every factory-video and factory-claims artifact except the newest of each
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILT: ${{ needs.build.result }}
        run: |
          prefixes="factory-claims-"
          [ "$BUILT" = success ] && prefixes="factory-video- factory-claims-"
          for prefix in $prefixes; do
            list="$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | "\(.created_at) \(.id) \(.name)"' |
              awk -v p="$prefix" 'index($3, p) == 1' | sort -r)"
            keep="$(printf '%s\n' "$list" | awk 'NF {print $2; exit}')"
            [ -n "$keep" ] || { echo "No ${prefix} artifact found; nothing deleted."; continue; }
            printf '%s\n' "$list" | while read -r created id name; do
              { [ -z "$id" ] || [ "$id" = "$keep" ]; } && continue
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
              echo "Deleted ${name} (${created})"
            done
            echo "Kept ${prefix} artifact ${keep}."
          done
