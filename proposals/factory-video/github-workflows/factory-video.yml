# Builds the software-factory slide assets in factory-video/ (decision 0007): the 18 s loop as a
# GIF and a 3-minute MP4, the narrated guided video with and without burned-in captions, its
# captions file, and the poster.
# The build job reads the repository and nothing else: no secrets, no AWS, no caches. Its output
# is one artifact. The prune job then deletes every earlier factory-video artifact, so only the
# newest build is kept. Nothing is committed and no release is made, so no job needs contents: write.
name: factory-video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory-video/**"
      - ".github/workflows/factory-video.yml"

permissions: {}
cache-mode: none

jobs:
  build:
    name: build and check the factory video
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: factory-video-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: factory-video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Normally about 20 s. A hung package mirror once held this step for a whole job, so each
      # attempt is capped, a failed attempt is retried once, and the step stops at 6 minutes.
      - name: Install ffmpeg, poppler and Liberation fonts
        timeout-minutes: 6
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          apt_install() {
            sudo timeout 60 apt-get "${apt_opts[@]}" update &&
              sudo timeout 90 apt-get "${apt_opts[@]}" install -y --no-install-recommends \
                ffmpeg poppler-utils fonts-liberation
          }
          if ! apt_install; then
            echo "::warning::apt failed or timed out; retrying once"
            sudo dpkg --configure -a || true
            apt_install
          fi
      # Playwright comes from the walkthrough's pinned package, so this kit adds no dependency.
      - name: Install Playwright from video/record, and Chromium
        timeout-minutes: 8
        working-directory: video/record
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo npx --no-install playwright install-deps chromium
          npx --no-install playwright install chromium
      # The voice: Kokoro from hash-pinned requirements, and its two model files, which narrate.py
      # checks against the SHA-256 pins in narration/models.json before use.
      - name: Install Kokoro and its model files
        timeout-minutes: 6
        run: |
          python3 -m venv "$RUNNER_TEMP/kokoro"
          "$RUNNER_TEMP/kokoro/bin/pip" install --quiet --require-hashes -r narration/requirements.txt
          mkdir -p "$RUNNER_TEMP/kokoro-models"
          base="$(jq -r .source narration/models.json)"
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/kokoro-models/$f" "$base/$f"
          done
          echo "NARRATE_PYTHON=$RUNNER_TEMP/kokoro/bin/python" >> "$GITHUB_ENV"
          echo "KOKORO_MODEL_DIR=$RUNNER_TEMP/kokoro-models" >> "$GITHUB_ENV"
      # build.sh ends with verify.mjs, so a failed check stops the job before anything is uploaded.
      - name: Build and check
        run: ./build.sh
      - name: Name the artifact factory-video-<short SHA>-<UTC build time>
        id: stamp
        run: echo "name=factory-video-${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - name: Upload the videos, GIF, captions and poster
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: |
            factory-video/out/factory-guided.mp4
            factory-video/out/factory-guided-clean.mp4
            factory-video/out/factory-guided.srt
            factory-video/out/factory-full-3min.mp4
            factory-video/out/factory-full-1920.gif
            factory-video/out/poster.png
            factory-video/out/poster.pdf
          if-no-files-found: error
          retention-days: 30

  prune:
    name: keep only the newest factory video
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: factory-video-prune
      cancel-in-progress: false
    permissions:
      actions: write # deletes earlier factory-video artifacts; nothing else in this job
    steps:
      - name: Delete every factory-video artifact except the newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          list="$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("factory-video-")) and (.expired | not)) | "\(.created_at) \(.id) \(.name)"' | sort -r)"
          keep="$(printf '%s\n' "$list" | awk 'NF {print $2; exit}')"
          [ -n "$keep" ] || { echo "No factory-video artifact found; nothing deleted."; exit 0; }
          printf '%s\n' "$list" | while read -r created id name; do
            { [ -z "$id" ] || [ "$id" = "$keep" ]; } && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "Deleted ${name} (${created})"
          done
          echo "Kept artifact ${keep}."
