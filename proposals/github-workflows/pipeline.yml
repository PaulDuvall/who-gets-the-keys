# The only path to the sandbox (SPEC-001). gates → build → attest → deploy.
# No caches in attest or deploy. The deploy role trusts only this file, in environment sandbox.
name: pipeline

on:
  push:
    branches: [main]

permissions: {}
cache-mode: none

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pipeline-gates-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install gate tools
        run: |
          scripts/ci/install-tools.sh "$RUNNER_TEMP/tools/bin"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Run every gate
        run: npm run gates

  build:
    name: build
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pipeline-build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Build the Lambda artifact
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p dist/function
          cp dist/src/*.js dist/function/
          echo '{"type":"module"}' > dist/function/package.json
          (cd dist/function && TZ=UTC touch -t 198001010000 ./* && zip -X -q ../function.zip ./*)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: function
          path: dist/function.zip
          if-no-files-found: error

  attest:
    name: attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pipeline-attest-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: function
          path: dist
      - name: Write the provenance predicate (commit, spec IDs, agent, model)
        run: |
          specs="$(git log -1 --format='%(trailers:key=Spec,valueonly,separator=%x2C)')"
          agent="$(git log -1 --format='%(trailers:key=Agent,valueonly)')"
          model="$(git log -1 --format='%(trailers:key=Model,valueonly)')"
          jq -n --arg commit "$GITHUB_SHA" --arg specs "$specs" --arg agent "$agent" --arg model "$model" \
            '{commit: $commit, spec_ids: ($specs | split(",") | map(select(. != ""))), agent: $agent, model: $model}' > predicate.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/function.zip
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/function.zip
          predicate-type: https://github.com/PaulDuvall/who-gets-the-keys/provenance/v1
          predicate-path: predicate.json

  deploy:
    name: deploy to sandbox
    needs: [build, attest]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sandbox
    concurrency:
      group: pipeline-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: function
          path: dist
      - name: Verify the artifact's attestation before any AWS call
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gates.ts attestation dist/function.zip
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Plan, check for irreversible changes, apply that plan
        working-directory: infra/sandbox
        run: |
          sha="$(openssl dgst -sha256 -binary ../../dist/function.zip | base64)"
          account="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=who-gets-the-keys-tfstate-${account}-us-east-1-an"
          terraform plan -input=false -out=plan.out -var "artifact_sha256=$sha"
          terraform show -json plan.out > plan.json
          (cd ../.. && node scripts/gates.ts irreversible infra/sandbox/plan.json)
          terraform apply -input=false plan.out
