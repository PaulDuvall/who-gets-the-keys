# Builds the software-factory slide assets in factory-video/ (decision 0008): the 18 s loop as a GIF and a 3-minute
# MP4, the narrated guided video with and without burned-in captions, its captions file, the poster, and the claims
# report: which on-screen claims the repository has built. The claims job checks the ledger alone, with no browser and
# no voice, on every push to main that can move a claim: a signed spec, a decision, a proposal, the backlog or the
# progress record. It uploads the report as factory-claims-<short SHA>-<UTC time>. The build job runs when the kit,
# this workflow or the end card's counts in docs/progress.json changed since the newest video a run on main built, or
# that build cannot be read, so the end card counts main (SPEC-001-R235), and on demand. On main, the pages job then
# calls pages.yml, which publishes that video and the practices poster to https://paulduvall.github.io/who-gets-the-keys/
# (SPEC-001-R236). No job reads a secret, uses AWS or a cache. The prune job keeps only the newest artifact of each kind
# for the run's branch. Nothing is committed and no release is made, so no job needs contents: write.
name: factory-video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory-video/**"
      - ".github/workflows/factory-video.yml"
      - ".github/workflows/pages.yml"
      - "specs/**"
      - "docs/decisions/**"
      - "proposals/**"
      - ".tasks/backlog.jsonl"
      - "docs/progress.json"

permissions: {}
cache-mode: none

jobs:
  claims:
    name: check the claims ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: factory-claims-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read # reads the newest factory-video artifact built on main, to decide whether to rebuild
    outputs:
      video: ${{ steps.paths.outputs.video }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # verify.mjs imports Playwright only for the browser checks, so this needs no npm install.
      - name: Check that every on-screen claim cites evidence that exists
        run: node factory-video/verify.mjs --only claims
      # Compared with the newest video this workflow built on main, not the previous push, so a build that failed, or a
      # run that a newer push cancelled, is built by the next run. A candidate counts only if its run is this workflow,
      # started by a push or by hand on main in this repository; the jq filter prints only fields of a fixed form, so no
      # artifact name can shift one. Any doubt builds (SPEC-001-R235, as SPEC-001-R232 does for sandbox).
      - name: Decide whether the video needs a rebuild, against the newest video built on main
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          video=true
          last=""
          newest_built() {
            filter='.artifacts[] | select((.expired | not) and .workflow_run != null and .workflow_run.head_branch == "main"
              and (.workflow_run.id | type) == "number" and (.workflow_run.head_sha | test("^[0-9a-f]{40}$"))
              and (.name | test("^factory-video-[0-9a-f]{7}-[0-9]{8}T[0-9]{4}Z$")))
              | "\(.workflow_run.id) \(.created_at) \(.workflow_run.head_sha)"'
            candidates="$(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" --jq "$filter" | sort -k1,1nr -k2,2r)"
            while read -r run _ sha; do
              [ -n "$run" ] || continue
              run_of="$(gh api "repos/${REPO}/actions/runs/${run}" --jq '"\(.event) \(.path) \(.head_branch) \(.head_repository.full_name)"')"
              case "$run_of" in
                "push .github/workflows/factory-video.yml main ${REPO}" | "workflow_dispatch .github/workflows/factory-video.yml main ${REPO}")
                  echo "$sha"
                  return 0 ;;
              esac
            done <<<"$candidates"
          }
          if [ "$EVENT" = push ]; then
            last="$(newest_built)" || last=""
          fi
          counts() { git show "$1:docs/progress.json" | jq -c '{requirements, claims}'; }
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$last" "$GITHUB_SHA" &&
            git diff --quiet "$last" "$GITHUB_SHA" -- factory-video .github/workflows/factory-video.yml &&
            [ "$(counts "$last")" = "$(counts "$GITHUB_SHA")" ]; then
            video=false
          fi
          echo "video=${video}" >> "$GITHUB_OUTPUT"
          if [ "$video" = true ]; then
            echo "Rebuild: the kit, this workflow or the end card's counts changed since ${last:-the newest video built on main}, or that build could not be read."
          else
            echo "No rebuild: nothing the video shows changed since ${last}, where the newest video on main was built."
          fi
      - name: Name the artifact factory-claims-<short SHA>-<UTC time>
        id: stamp
        run: echo "name=factory-claims-${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - name: Upload the claims report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: factory-video/out/claims-report.md
          if-no-files-found: error
          retention-days: 30

  build:
    name: build and check the factory video
    needs: claims
    if: needs.claims.outputs.video == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: factory-video-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: factory-video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Normally about 20 s. A hung package mirror once held this step for a whole job, so each
      # attempt is capped, a failed attempt is retried once, and the step stops at 6 minutes.
      - name: Install ffmpeg, poppler and Liberation fonts
        timeout-minutes: 6
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          apt_install() {
            sudo timeout 60 apt-get "${apt_opts[@]}" update &&
              sudo timeout 90 apt-get "${apt_opts[@]}" install -y --no-install-recommends \
                ffmpeg poppler-utils fonts-liberation
          }
          if ! apt_install; then
            echo "::warning::apt failed or timed out; retrying once"
            sudo dpkg --configure -a || true
            apt_install
          fi
      # Playwright comes from the walkthrough's pinned package, so this kit adds no dependency.
      - name: Install Playwright from video/record, and Chromium
        timeout-minutes: 8
        working-directory: video/record
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo npx --no-install playwright install-deps chromium
          npx --no-install playwright install chromium
      # The voice: Kokoro from hash-pinned requirements, and its two model files, which narrate.py
      # checks against the SHA-256 pins in narration/models.json before use.
      - name: Install Kokoro and its model files
        timeout-minutes: 6
        run: |
          python3 -m venv "$RUNNER_TEMP/kokoro"
          "$RUNNER_TEMP/kokoro/bin/pip" install --quiet --require-hashes -r narration/requirements.txt
          mkdir -p "$RUNNER_TEMP/kokoro-models"
          base="$(jq -r .source narration/models.json)"
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/kokoro-models/$f" "$base/$f"
          done
          echo "NARRATE_PYTHON=$RUNNER_TEMP/kokoro/bin/python" >> "$GITHUB_ENV"
          echo "KOKORO_MODEL_DIR=$RUNNER_TEMP/kokoro-models" >> "$GITHUB_ENV"
      # build.sh ends with verify.mjs, so a failed check stops the job before anything is uploaded.
      - name: Build and check
        run: ./build.sh
      - name: Name the artifact factory-video-<short SHA>-<UTC build time>
        id: stamp
        run: echo "name=factory-video-${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - name: Upload the videos, GIF, captions and poster
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: |
            factory-video/out/factory-guided.mp4
            factory-video/out/factory-guided-clean.mp4
            factory-video/out/factory-guided.srt
            factory-video/out/factory-full-3min.mp4
            factory-video/out/factory-full-1920.gif
            factory-video/out/poster.png
            factory-video/out/poster.pdf
            factory-video/out/claims-report.md
          if-no-files-found: error
          retention-days: 90 # pages.yml publishes the newest of these, so it must outlive a quiet spell (SPEC-001-R236)

  # Publishes the site with the shared workflow (SPEC-001-R236), on every run on main whose build passed or was not
  # needed, so a deploy that failed is tried again by the next run. One concurrency group across both kits' workflows,
  # newest wins: it always takes the newest build of each kit.
  pages:
    name: publish the site to GitHub Pages
    needs: [claims, build]
    if: always() && github.ref == 'refs/heads/main' && needs.claims.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    concurrency:
      group: github-pages-site
      cancel-in-progress: true
    permissions:
      actions: read # pages.yml's assemble job reads the kits' artifacts and their runs
      contents: read # pages.yml's assemble job reads main's tip; nothing is checked out
      pages: write # pages.yml's deploy job creates the Pages deployment
      id-token: write # pages.yml's deploy job proves to GitHub Pages which workflow, ref and run it is
    uses: $/.github/workflows/pages.yml # the self-repository form: pages.yml at this run's commit

  prune:
    name: keep only the newest factory video and claims report
    needs: [claims, build]
    if: always() && needs.claims.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: factory-video-prune
      cancel-in-progress: false
    permissions:
      actions: write # deletes earlier factory-video artifacts; nothing else in this job
    steps:
      # Only this branch's artifacts: a run on another branch must not delete the newest build on main, which pages.yml
      # publishes (SPEC-001-R236).
      - name: Delete every factory-video and factory-claims artifact of this branch except the newest of each
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILT: ${{ needs.build.result }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "This prunes only branches named with letters, digits, '.', '_', '/' and '-'; nothing deleted."
            exit 0
          fi
          prefixes="factory-claims-"
          [ "$BUILT" = success ] && prefixes="factory-video- factory-claims-"
          for prefix in $prefixes; do
            # Newest run first; every field printed has a fixed form, so no artifact name can shift one.
            list="$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.expired | not) and .workflow_run != null and .workflow_run.head_branch == "'"$BRANCH"'"
                and (.workflow_run.id | type) == "number" and (.name | startswith("'"$prefix"'")))
                | "\(.workflow_run.id) \(.created_at) \(.id)"' | sort -k1,1nr -k2,2r)"
            keep="$(printf '%s\n' "$list" | awk 'NF && !n {print $3; n = 1}')"
            [ -n "$keep" ] || { echo "No ${prefix} artifact from ${BRANCH} found; nothing deleted."; continue; }
            printf '%s\n' "$list" | while read -r run created id; do
              { [ -z "$id" ] || [ "$id" = "$keep" ]; } && continue
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
              echo "Deleted ${prefix} artifact ${id} (run ${run}, ${created})"
            done
            echo "Kept ${prefix} artifact ${keep} from ${BRANCH}."
          done
