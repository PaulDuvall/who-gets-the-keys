# Builds the practices carousel in practices-carousel/ (decision 0009): carousel.yaml rendered to an 11-page PDF,
# a PNG per page, a contact sheet and the one-page poster, with verify.mjs's checks and report. It runs on a push to
# main that changes the kit, practices.yaml (every row cites its IDs), the files page 11's Receipt check reads or this
# workflow, and on demand. That check verifies signatures over commits in the history, so the checkout fetches all of it. The build job
# uploads out/ as one artifact, practices-carousel-<short SHA>-<UTC time>, kept 90 days. The prune job then deletes the
# ones that earlier runs on the run's branch uploaded. On main, the pages job calls pages.yml,
# which publishes the poster's front and back beside the factory video at https://paulduvall.github.io/who-gets-the-keys/
# (SPEC-001-R236). No job reads a secret, uses AWS or a cache. Nothing is committed and no release is made, so no job
# needs contents: write.
name: practices-carousel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "practices-carousel/**"
      - "practices.yaml"
      - "scenarios/scenarios.yaml"
      - "docs/notes/practices-carousel.md"
      - ".github/workflows/practices-carousel.yml"
      - ".github/workflows/pages.yml"

permissions: {}
cache-mode: none

jobs:
  build:
    name: build and check the practices carousel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: practices-carousel-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # The kit reads carousel.yaml with the root yaml package, already a devDependency, so this adds nothing.
      - name: Install the root packages, for yaml
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Normally a few seconds. A hung package mirror once held this step for a whole job in factory-video.yml, so
      # each attempt is capped, a failed attempt is retried once, and the step stops at 6 minutes.
      - name: Install poppler, for pdfinfo, pdffonts and pdftotext
        timeout-minutes: 6
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          apt_install() {
            sudo timeout 60 apt-get "${apt_opts[@]}" update &&
              sudo timeout 90 apt-get "${apt_opts[@]}" install -y --no-install-recommends poppler-utils
          }
          if ! apt_install; then
            echo "::warning::apt failed or timed out; retrying once"
            sudo dpkg --configure -a || true
            apt_install
          fi
      # Playwright comes from the walkthrough's pinned package, through factory-video/playwright.mjs.
      - name: Install Playwright from video/record, and Chromium
        timeout-minutes: 8
        working-directory: video/record
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo npx --no-install playwright install-deps chromium
          npx --no-install playwright install chromium
      # build.sh downloads the fonts fonts.json pins, refuses any whose SHA-256 differs, renders, and ends with
      # verify.mjs, so a failed check stops the job before anything is uploaded.
      - name: Build and check
        run: practices-carousel/build.sh
      - name: Name the artifact practices-carousel-<short SHA>-<UTC build time>
        id: stamp
        run: echo "name=practices-carousel-${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - name: Upload the PDFs, page images, contact sheet, poster and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: practices-carousel/out/
          if-no-files-found: error
          retention-days: 90 # pages.yml publishes the newest of these, so it must outlive a quiet spell (SPEC-001-R236)

  # Publishes the site with the shared workflow (SPEC-001-R236). One concurrency group across both kits' workflows,
  # newest wins: it always takes the newest build of each kit.
  pages:
    name: publish the site to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: github-pages-site
      cancel-in-progress: true
    permissions:
      actions: read # pages.yml's assemble job reads the kits' artifacts and their runs
      contents: read # pages.yml's assemble job reads main's tip and compares commits; nothing is checked out
      pages: write # pages.yml's deploy job creates the Pages deployment
      id-token: write # pages.yml's deploy job proves to GitHub Pages which workflow, ref and run it is
    uses: $/.github/workflows/pages.yml # the self-repository form: pages.yml at this run's commit

  prune:
    name: delete earlier runs' practices carousels
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: practices-carousel-prune
      cancel-in-progress: false
    permissions:
      actions: write # deletes earlier practices-carousel artifacts; nothing else in this job
    steps:
      # Only artifacts that earlier runs on this run's own branch uploaded: this run's build, which it just uploaded, and any
      # newer run's, stay, so a run on another branch, a tag or a pull request whose head is named main cannot remove the
      # build pages.yml publishes (SPEC-001-R236). Every field printed has a fixed form, so no artifact name can shift one.
      - name: Delete the practices-carousel artifacts that earlier runs on this branch uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          case "$REF" in
            refs/heads/*) branch="${REF#refs/heads/}" ;;
            *) echo "${REF} is not a branch; nothing deleted."; exit 0 ;;
          esac
          if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ && "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "This prunes only branches named with letters, digits, '.', '_', '/' and '-'; nothing deleted."
            exit 0
          fi
          prefix="practices-carousel-"
          list="$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired | not) and .workflow_run != null and .workflow_run.head_branch == "'"$branch"'"
              and (.workflow_run.id | type) == "number" and .workflow_run.id < '"$RUN_ID"' and (.name | startswith("'"$prefix"'")))
              | "\(.workflow_run.id) \(.created_at) \(.id)"')"
          if [ -z "$list" ]; then
            echo "No ${prefix} artifact from an earlier run on ${branch}; nothing deleted."
            exit 0
          fi
          printf '%s\n' "$list" | while read -r run created id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "Deleted ${prefix} artifact ${id} (run ${run}, ${created})"
          done
