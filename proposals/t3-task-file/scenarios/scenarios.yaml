# Bad scenarios (SPEC-001-R19 to R38, R72, R73). Each `expect` was observed from a real failing run.
# requires: github-actions → scenarios.yml b9-replay; sandbox-account → scenarios.yml on-demand.
# task: a fixture the harness commits as tasks/<ID>.task.md before the patch; run: task-verify or scope-verify runs
# only the task check, or the task and scope checks, over the range from that commit (SPEC-001-R107).
scenarios:
  - id: B1
    title: Test with no assertion
    patch: scenarios/B01-test-without-assertion.patch
    check: lint
    expect: "CHECK lint FAILED: vitest/expect-expect"
    slide: [5, 12]
    spec: SPEC-014-R1
  - id: B2
    title: Weak assertion
    patch: scenarios/B02-weak-assertion.patch
    check: mutation
    expect: "CHECK mutation FAILED: below break threshold"
    slide: [5, 7]
    spec: SPEC-014-R5
  - id: B3
    title: Code change with no spec ID
    patch: scenarios/B03-change-without-spec-trailer.patch
    check: trace
    expect: "CHECK trace FAILED: missing Spec trailer"
    slide: [3, 13]
  - id: B4
    title: Agent rewrites acceptance criteria to fit its code
    patch: scenarios/B04-unsigned-acceptance-criteria-rewrite.patch
    check: signatures
    expect: "CHECK signatures FAILED: unsigned change to specs/"
    slide: [3, 11]
    spec: SPEC-014-R4
  - id: B5
    title: Hard-coded secret
    patch: scenarios/B05-hard-coded-secret.patch
    check: secrets
    expect: "CHECK secrets FAILED: telegram-bot-api-token"
    slide: [4]
    spec: SPEC-014-R4
  - id: B6
    title: Invented package name
    patch: scenarios/B06-invented-package-name.patch
    check: allowlist
    expect: "CHECK allowlist FAILED: csv-export-turbo"
    slide: [6, 12]
    spec: SPEC-014-R1
  - id: B7
    title: Guardrail loosened
    patch: scenarios/B07-lowered-break-threshold.patch
    check: ratchet
    expect: "CHECK ratchet FAILED: break threshold lowered"
    slide: [8]
    spec: SPEC-001-R16
  - id: B8a
    title: Cache in a deploy job
    patch: scenarios/B08a-cache-in-deploy-job.patch
    check: workflows
    expect: "CHECK workflows FAILED: deploy-cache"
    slide: [9, 10]
    spec: SPEC-001-R4
  - id: B8b
    title: Action pinned by tag
    patch: scenarios/B08b-action-pinned-by-tag.patch
    check: workflows
    expect: "CHECK workflows FAILED: unpinned-uses"
    slide: [10]
    spec: SPEC-001-R4
  - id: B9
    title: Poisoned issue 4821
    fixture: scenarios/fixtures/issue-4821.md
    check: boundary
    expect: "BOUNDARY HELD"
    slide: [6, 9, 12]
    requires: github-actions
  - id: B10
    title: Unattested artifact reaches deploy
    patch: scenarios/B10-unattested-artifact.patch
    check: attestation
    expect: "CHECK attestation FAILED"
    slide: [7, 13]
    spec: SPEC-001-R17
    run: deploy-verify
  - id: B11
    title: Non-deploy principal writes the sandbox
    check: boundary
    expect: "BOUNDARY HELD: with an explicit deny in a service control policy"
    slide: [10]
    requires: sandbox-account
  - id: B12
    title: Command injection in your code
    patch: scenarios/B12-command-injection-in-code.patch
    check: sast
    expect: "CHECK sast FAILED: javascript.lang.security.detect-child-process.detect-child-process"
    slide: [4]
    spec: SPEC-014-R1
  - id: B13
    title: Command injection in imported code
    patch: scenarios/B13-vulnerable-dependency.patch
    check: sca
    expect: "CHECK sca FAILED: GHSA-r5fr-rjxr-66jc"
    slide: [4]
    spec: SPEC-014-R1
  - id: B14
    title: Irreversible change without approval
    patch: scenarios/B14-irreversible-table-rename.patch
    check: irreversible
    expect: "CHECK irreversible FAILED: aws_dynamodb_table.export_jobs"
    slide: [8, 10]
    requires: sandbox-account
  - id: B15
    title: Requirement with no test
    patch: scenarios/B15-requirement-without-test.patch
    check: trace
    expect: "CHECK trace FAILED: SPEC-014-R7 has no test"
    slide: [7, 13]
    spec: SPEC-014-R1
  - id: B16
    title: Capability with no requirement
    patch: scenarios/B16-capability-without-requirement.patch
    check: trace
    expect: "CHECK trace FAILED: export toJsonLines has no requirement"
    slide: [7, 13]
    spec: SPEC-014-R1
  - id: B17
    title: Tampered source of record
    patch: scenarios/B17-tampered-source-of-record.patch
    check: signatures
    expect: "CHECK signatures FAILED: unsigned change to specs/source-of-record/slides.txt"
    slide: [6]
    spec: SPEC-014-R1
  - id: B18
    title: Agent loosens the pipeline without a signature
    patch: scenarios/B18-unsigned-pipeline-change.patch
    check: signatures
    expect: "CHECK signatures FAILED: unsigned change to .github/"
    slide: [8]
    spec: SPEC-001-R12
  - id: B23
    title: Change outside the task's scope
    patch: scenarios/B23-change-outside-task-scope.patch
    task: scenarios/fixtures/tasks/TASK-B23.task.md
    check: scope
    expect: "CHECK scope FAILED: src/handler.ts"
    slide: [8, 11]
    spec: SPEC-014-R2
    run: scope-verify
  - id: B24
    title: Task citing an unapproved requirement
    task: scenarios/fixtures/tasks/TASK-B24.task.md
    check: task
    expect: "CHECK task FAILED: TASK-B24 cites unapproved SPEC-014-R99"
    slide: [3, 8]
    run: task-verify
