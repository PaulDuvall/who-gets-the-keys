[[IgnoredVulns]]
id = "GHSA-mf5v-w3w3-f6cg"
ignoreUntil = 2026-12-08T00:00:00Z
reason = "opentelemetry-api 1.37.0 in scripts/ci/requirements.txt, fixed in 1.45.2 (GitHub-reviewed 2026-11-13). semgrep 1.181.0 through 1.185.0, the latest on PyPI on 2026-11-13, require opentelemetry-api~=1.37.0. The advisory is quadratic-time regex backtracking in TraceContextTextMapPropagator.extract() on a crafted traceparent. semgrep 1.181.0 calls it only from Telemetry.extract(), which runs only with --trace and builds the traceparent from the SEMGREP_TRACE_PARENT_TRACE_ID and SEMGREP_TRACE_PARENT_SPAN_ID environment variables; the sast check runs semgrep scan without --trace, so no scanned file reaches it. CPU only, CI toolchain only, not in the Lambda artifact. Checked 2026-11-13; expires with the other exceptions on 2026-12-08."
